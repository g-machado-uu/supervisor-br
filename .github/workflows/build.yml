name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The job token can only read the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs; the comment says which release.
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # Fails on known vulnerabilities in Cargo.lock; unmaintained crates are only reported.
      - run: cargo audit

  build:
    needs: audit
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: supervisor-br
          - os: windows-latest
            artifact: supervisor-br.exe
          - os: macos-latest
            artifact: supervisor-br
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supervisor-br-${{ runner.os }}
          path: target/release/${{ matrix.artifact }}

  # One SHA256SUMS.txt for all three binaries, then (for a tag) the release:
  # a zip per system and the notes from .github/release-notes/<tag>.md, with
  # the steps for checking a download added at the end.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - working-directory: dist
        run: sha256sum supervisor-br-*/* | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # The program at the top of each zip, as the checking steps expect.
          for os in Linux macOS Windows; do
            chmod +x supervisor-br-$os/*
            (cd supervisor-br-$os && zip -X ../supervisor-br-$os.zip *)
          done
          assets=(supervisor-br-*.zip SHA256SUMS.txt)
          notes=../.github/release-notes/$TAG.md
          if [ ! -f "$notes" ]; then
            echo "::error::No release notes in .github/release-notes/$TAG.md"
            exit 1
          fi
          cat "$notes" ../.github/release-notes/checking-your-download.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "Supervisor BR $TAG" --notes-file notes.md --verify-tag
          fi
