[package]
name = "supervisor-br"
version = "0.5.0"
description = "Acompanhamento de orientandos para professores de universidades brasileiras"
edition = "2024"
# Required by egui 0.37.
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
blake2 = "0.10.6"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
jiff = "0.2"
rand = "0.8"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = "1.9.1"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3.27.0"

# Argon2 and egui are slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
